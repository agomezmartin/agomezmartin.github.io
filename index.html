<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Botanical Concrete</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<meta name="theme-color" content="#21C063" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>

html,body{
  margin:0;
  overflow:hidden;
  font-family:'Phenomena','Helvetica Neue',sans-serif;
}

/* 🌊 Fondo vivo */
body{
  --gx:50%;
  --gy:30%;

  background: radial-gradient(
    ellipse 130% 80% at var(--gx) var(--gy),
    #f8b6ba 0%,
    #ffeff0 100%
  );
}

/* Canvas full screen */
canvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
}

/* 🌿 TEXTO (base neutra, se controla por JS) */
.overlay-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-weight:100;
  text-align:center;
  z-index:10;
  pointer-events:none;

  color: rgba(25,25,25,0.8);
  text-shadow:
    0 2px 10px rgba(255,255,255,0.15),
    0 12px 30px rgba(0,0,0,0.12);

  /* 🖥 desktop base */
  font-size: clamp(28px, 4vw + 2vh, 72px);

  /* base neutra */
  color: rgba(25,25,25,0.8);

  text-shadow:
    0 2px 10px rgba(255,255,255,0.15),
    0 12px 30px rgba(0,0,0,0.12);
}

/* 📱 MOBILE VERTICAL (más grande y protagonista) */
@media (max-width: 600px) and (orientation: portrait){
  .overlay-text{
    font-size: clamp(44px, 10vw + 6vh, 110px);
  }
}

/* 📱 MOBILE HORIZONTAL */
@media (max-width: 900px) and (orientation: landscape){
  .overlay-text{
    font-size: clamp(32px, 6vw + 3vh, 80px);
  }
}

</style>
</head>

<body>

<div class="overlay-text" id="text">
Replantea tu espacio.<br>Vence al hormigón.
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

/* ---------------- RENDER ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------------- SCENE ---------------- */
const scene = new THREE.Scene();

/* ---------------- CAMERA ---------------- */
const camera = new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
camera.position.set(0,3,10);

/* ---------------- LIGHT ---------------- */
const light = new THREE.DirectionalLight(0xffffff,1.2);
light.position.set(5,10,5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.25));

/* ---------------- LEAF ---------------- */
function leafTexture(){
  const c=document.createElement('canvas');
  c.width=c.height=128;
  const ctx=c.getContext('2d');

  ctx.beginPath();
  ctx.moveTo(64,10);
  ctx.bezierCurveTo(100,40,100,90,64,118);
  ctx.bezierCurveTo(28,90,28,40,64,10);

  const g=ctx.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#7fcf7f');
  g.addColorStop(1,'#2f5f2f');

  ctx.fillStyle=g;
  ctx.fill();

  return new THREE.CanvasTexture(c);
}

const tex=leafTexture();

/* ---------------- PLANTS ---------------- */
function plant(x,z){
  const g=new THREE.Group();
  let h=0;

  for(let i=0;i<12;i++){
    h+=0.25;

    const mat=new THREE.MeshStandardMaterial({
      map:tex,
      transparent:true,
      side:THREE.DoubleSide,
      roughness:0.9
    });

    const m=new THREE.Mesh(
      new THREE.PlaneGeometry(0.5,0.8),
      mat
    );

    const a=Math.random()*Math.PI*2;
    m.position.set(x+Math.cos(a)*0.25,h,z+Math.sin(a)*0.25);
    m.rotation.y=a;

    g.add(m);
  }

  return g;
}

let plants=[];

function generate(){
  plants.forEach(p=>scene.remove(p));
  plants=[];

  const width=12*camera.aspect;

  for(let i=0;i<width*2;i++){
    const x=(Math.random()-0.5)*width;
    const z=(Math.random()-0.5)*10;

    const p=plant(x,z);
    scene.add(p);
    plants.push(p);
  }
}

generate();

/* ---------------- ANIMATION ---------------- */
let t=0;
const text=document.getElementById('text');

function animate(){
  requestAnimationFrame(animate);
  t+=0.003;

  /* cámara */
  camera.position.x=Math.sin(t*0.4)*0.8;
  camera.position.y=3+Math.sin(t*0.3)*0.3;
  camera.lookAt(0,1,0);

  /* fondo vivo */
  const gx=50+Math.sin(t*0.5)*12;
  const gy=30+Math.sin(t*0.7)*10;

  document.body.style.setProperty('--gx',gx+'%');
  document.body.style.setProperty('--gy',gy+'%');

  /* 🌿 plantas */
  plants.forEach(p=>{
    p.rotation.y+=0.002;
  });

  /* 🌫 COLOR GRADING PARA TEXTO */
  const tone = Math.sin(t*0.5)*0.5 + 0.5;

  const r = 20 + tone*20;
  const g = 20 + tone*20;
  const b = 20 + tone*20;

  const alpha = 0.75 + tone*0.15;

  text.style.color = `rgba(${r},${g},${b},${alpha})`;

  /* flotación texto */
  const fy=Math.sin(t*2)*5;
  const fx=Math.sin(t*1.2)*3;

  text.style.transform =
    `translate(-50%, calc(-50% + ${fy}px)) translateX(${fx}px)`;

  renderer.render(scene,camera);
}

animate();

/* ---------------- RESIZE ---------------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  generate();
});
</script>

</body>
</html>
