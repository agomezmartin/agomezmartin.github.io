<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Botanical Concrete</title>
  <!-- Android Chrome -->
  <meta name="theme-color" content="#21C063" />
  <!-- <meta name="theme-color" content="#A8D8FF" /> --> <!-- Galician flag colors -->

  <!-- Safari (iOS) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- <meta name="apple-mobile-web-app-status-bar-style" content="blue-translucent" /> --> <!-- Galician flag colors -->

  <!-- Windows Phone -->
  <meta name="msapplication-navbutton-color" content="#21C063" />
  <!-- <meta name="msapplication-navbutton-color" content="#A8D8FF" /> --> <!-- Galician flag colors -->
<style>
/* Carga de Phenomena con distintos pesos */
@font-face {
  font-family: 'Phenomena';
  src: url('./fonts/Phenomena/WEB/Phenomena-Thin.woff2') format('woff2'),
       url('./fonts/Phenomena/WEB/Phenomena-Thin.woff') format('woff');
  font-weight: 100;
  font-style: normal;
}
@font-face {
  font-family: 'Phenomena';
  src: url('./fonts/Phenomena/WEB/Phenomena-Regular.woff2') format('woff2'),
       url('./fonts/Phenomena/WEB/Phenomena-Regular.woff') format('woff');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'Phenomena';
  src: url('./fonts/Phenomena/WEB/Phenomena-Black.woff2') format('woff2'),
       url('./fonts/Phenomena/WEB/Phenomena-Black.woff') format('woff');
  font-weight: 900;
  font-style: normal;
}

body {
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at 50% 20%,
  #f8b6ba 0%,
  #ffeff0 100%
);
  font-family: 'Phenomena', 'Helvetica Neue', sans-serif;
  color: #e0e0d0;
}

/* Overlay de texto centrado y dinámico */
.overlay-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: clamp(20px, 5vw + 2vh, 72px);
  font-weight: 100; /* Thin por defecto en desktop */
  line-height: 1.2;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 0 15px rgba(0,0,0,0.7);
  transition: transform 0.1s linear;
}

/* Tablet */
@media(max-width: 1024px){
  .overlay-text { font-weight: 400; } /* Regular */
}

/* Smartphone horizontal */
@media(max-width: 480px) and (orientation: landscape){
  .overlay-text { font-weight: 400; font-size: clamp(20px, 5vw + 2vh, 40px); }
}

/* Smartphone vertical */
@media(max-width: 480px) and (orientation: portrait){
  .overlay-text {
    font-weight: 400; 
    font-size: clamp(28px, 6vw + 4vh, 64px);
  }
}
</style>
</head>
<body>

<div class="overlay-text" id="floating-text">
  Replantea tu espacio.<br>Vence al hormigón
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

// ---------------------
/* RENDER */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------------------
/* ESCENA */
const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.Fog(0x000000, 6, 20);

// ---------------------
// CÁMARA
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1,100);
camera.position.set(0,3,10);

// ---------------------
/* SUELO */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({
    color: 0xee2a34,
    transparent: true,
    opacity: 0.25,
    roughness: 1
  })
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-1;
ground.receiveShadow=true;
scene.add(ground);

// ---------------------
// LUCES
const key = new THREE.DirectionalLight(0xffffff,1.2);
key.position.set(6,10,4); key.castShadow=true; key.shadow.mapSize.set(2048,2048); scene.add(key);

const fill = new THREE.DirectionalLight(0x6a8f6a,0.35); fill.position.set(-4,5,-3); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,0.2));

// ---------------------
// TEXTURA HOJA
function createLeafTexture(){
  const size=128; const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,size,size);
  ctx.beginPath();
  ctx.moveTo(size/2,size*0.1);
  ctx.bezierCurveTo(size*0.8,size*0.3,size*0.8,size*0.7,size/2,size*0.9);
  ctx.bezierCurveTo(size*0.2,size*0.7,size*0.2,size*0.3,size/2,size*0.1);
  ctx.closePath();
  const gradient=ctx.createLinearGradient(0,0,0,size);
  gradient.addColorStop(0,'#6fae6f'); gradient.addColorStop(1,'#2f5f2f');
  ctx.fillStyle=gradient; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(size/2,size*0.15); ctx.lineTo(size/2,size*0.85); ctx.stroke();
  return new THREE.CanvasTexture(canvas);
}

const leafTexture=createLeafTexture();
function createLeafMaterial(){ return new THREE.MeshStandardMaterial({map:leafTexture,transparent:true,alphaTest:0.2,side:THREE.DoubleSide,roughness:0.85,emissive:0x0a1a0f,emissiveIntensity:0.15}); }
function createLeafMesh(){ const geo=new THREE.PlaneGeometry(0.5,0.8); const mat=createLeafMaterial(); const mesh=new THREE.Mesh(geo,mat); mesh.castShadow=true; mesh.rotation.z=(Math.random()-0.5)*0.4; mesh.scale.setScalar(0.8+Math.random()*0.4); return mesh; }

function createPlant(x,z){
  const group=new THREE.Group(); let height=0;
  const count=8+Math.floor(Math.random()*6);
  for(let i=0;i<count;i++){
    height+=0.3+Math.random()*0.1;
    const leaf=createLeafMesh();
    const angle=Math.random()*Math.PI*2;
    const radius=0.15+Math.random()*0.2;
    leaf.position.set(x+Math.cos(angle)*radius,height,z+Math.sin(angle)*radius);
    leaf.rotation.y=angle; leaf.rotation.x=(Math.random()-0.5)*0.5;
    group.add(leaf);
  }
  return group;
}

let plants=[];
function generate(){ plants.forEach(p=>scene.remove(p.group)); plants=[];
  const width=10*camera.aspect; const depth=10; const count=Math.floor(width*1.5);
  for(let i=0;i<count;i++){ const x=(Math.random()-0.5)*width; const z=(Math.random()-0.5)*depth; const group=createPlant(x,z); scene.add(group); plants.push({group,phase:Math.random()*10,x,z}); } }

generate();

// ---------------------
// ANIMACIÓN
let t=0; const textEl=document.getElementById('floating-text');
function animate(){
  requestAnimationFrame(animate);
  t+=0.003;

  camera.position.x=Math.sin(t*0.3)*0.5; camera.lookAt(0,1,0);

  // Rotación plantas
  plants.forEach(p=>p.group.rotation.y=Math.sin(t+p.phase)*0.06);

  // Movimiento texto
  const floatY=Math.sin(t*2)*5; const floatX=Math.sin(t*1.2)*3;
  textEl.style.transform=`translate(-50%, calc(-50% + ${floatY}px)) translateX(${floatX}px)`;

  // Interacción texto → plantas
  const textScreenX=0; const textScreenZ=0; 
  plants.forEach(p=>{
    const dx=p.x-textScreenX; const dz=p.z-textScreenZ;
    const dist=Math.sqrt(dx*dx+dz*dz);
    const influence=Math.max(0, 1-(dist/5));
    p.group.rotation.y+=Math.sin(t*2+p.phase)*0.01*influence;
    p.group.position.y=0.0 + 0.05*Math.sin(t*3+p.phase)*influence;
  });

  renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  generate();
});
</script>

</body>
</html>
