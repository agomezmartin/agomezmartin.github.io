<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Concrete vs Nature</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0b0b0b;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

// ---------------------
// ESCENA BASE
// ---------------------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ---------------------
// HORMIGÓN (PLANO)
// ---------------------
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.MeshStandardMaterial({
    color: 0x7a7a7a,
    roughness: 1,
    metalness: 0,
  })
);

plane.rotation.x = -Math.PI / 2;
plane.position.y = -1;
scene.add(plane);

// ---------------------
// LUZ (SUAVE Y CONTROLADA)
// ---------------------
const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(3, 5, 2);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// ---------------------
// VEGETACIÓN MINIMAL
// ---------------------
const vines = [];

for (let i = 0; i < 12; i++) {
  const points = [];
  const baseX = (Math.random() - 0.5) * 4;
  const baseZ = (Math.random() - 0.5) * 4;

  for (let j = 0; j < 12; j++) {
    points.push(new THREE.Vector3(
      baseX,
      j * 0.2,
      baseZ
    ));
  }

  const curve = new THREE.CatmullRomCurve3(points);

  const geometry = new THREE.TubeGeometry(curve, 40, 0.015, 6, false);

  const material = new THREE.MeshStandardMaterial({
    color: 0x3aa76d,
    emissive: 0x0f2a1d,
    roughness: 0.7
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  vines.push({ mesh, offset: Math.random() * 10 });
}

// ---------------------
// ANIMACIÓN ORGÁNICA
// ---------------------
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  vines.forEach((v, i) => {
    const pos = v.mesh.geometry.attributes.position;

    for (let j = 0; j < pos.count; j++) {
      const y = pos.getY(j);

      const sway = Math.sin(t + y * 3 + v.offset) * 0.01;

      pos.setX(j, pos.getX(j) + sway);
      pos.setZ(j, pos.getZ(j) + sway);
    }

    pos.needsUpdate = true;
  });

  renderer.render(scene, camera);
}

animate();

// ---------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
