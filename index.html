<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Jungle over Concrete</title>
<style>
  body { margin: 0; overflow: hidden; background: #0b0b0b; }
</style>
</head>
<body>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

// ---------------------
// BASE
// ---------------------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ---------------------
// HORMIGÓN
// ---------------------
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.MeshStandardMaterial({ color: 0x6f6f6f, roughness: 1 })
);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -1;
scene.add(plane);

// ---------------------
// LUZ
// ---------------------
const light = new THREE.DirectionalLight(0xffffff, 1.3);
light.position.set(3, 6, 3);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));

// ---------------------
// HOJA (GEOMETRÍA SIMPLE)
// ---------------------
const leafGeo = new THREE.PlaneGeometry(0.12, 0.25);
const leafMat = new THREE.MeshStandardMaterial({
  color: 0x3fa36b,
  side: THREE.DoubleSide,
  roughness: 0.8
});

// ---------------------
// PLANTAS
// ---------------------
const plants = [];

for (let i = 0; i < 10; i++) {

  const group = new THREE.Group();

  const baseX = (Math.random() - 0.5) * 5;
  const baseZ = (Math.random() - 0.5) * 5;

  let height = 0;

  for (let j = 0; j < 14; j++) {

    height += 0.18;

    // curvatura orgánica
    const x = baseX + Math.sin(j * 0.4 + i) * 0.2;
    const z = baseZ + Math.cos(j * 0.4 + i) * 0.2;

    // hoja
    if (j > 2) {
      const leaf = new THREE.Mesh(leafGeo, leafMat);

      leaf.position.set(x, height, z);

      leaf.rotation.y = Math.random() * Math.PI;
      leaf.rotation.x = (Math.random() - 0.5) * 0.6;

      group.add(leaf);
    }
  }

  scene.add(group);

  plants.push({
    group,
    phase: Math.random() * 10
  });
}

// ---------------------
// ANIMACIÓN
// ---------------------
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  plants.forEach(p => {
    p.group.rotation.y = Math.sin(t * 0.3 + p.phase) * 0.1;
  });

  renderer.render(scene, camera);
}

animate();

// ---------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
